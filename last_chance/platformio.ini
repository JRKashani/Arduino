; PlatformIO project for the "last_chance" robot firmware.
; Board: Arduino Mega 2560. Shared libraries live one level up in ../libraries
; (single source of truth for all sketches in this repo) and are pulled in via
; lib_extra_dirs; the Library Dependency Finder compiles only the ones included.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../libraries

; Host-based unit tests for the Arduino-free logic in lib/Control.
; Run with: pio test -e native  (needs a host gcc/g++ on PATH).
; The board firmware in src/ is intentionally NOT built here.
[env:native]
platform = native
test_framework = unity
